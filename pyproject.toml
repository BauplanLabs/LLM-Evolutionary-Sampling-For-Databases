[project]
name = "faster-dbs-with-llms"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.3.0",
    "modal>=1.0.4",
    "openai>=1.82.1",
    "pytest>=8.3.5",
    "python-dotenv>=1.1.0",
    "litellm>=1.81.9,<1.88.0",
    "jsonpatch>=1.33",
    "ipykernel>=6.30.1",
    "seaborn>=0.13.2",
    "jupyter>=1.1.1",
    "pyarrow>=23.0.0",
    "boto3>=1.42.40",
    "pandas>=2.3.3",
    "matplotlib>=3.10.8",
    "tqdm>=4.67.2"
]

[project.optional-dependencies]
local = ["datafusion"]

[tool.uv.sources]
datafusion = { path = "datafusion_patched" }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
